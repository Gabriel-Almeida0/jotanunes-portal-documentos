openapi: 3.0.3
info:
  title: API do Portal de Documentação de Terceirizadas Jotanunes
  version: 1.4.0
  license:
    name: Proprietário — Jotanunes Construtora
  description: |
    Contrato ÚNICO entre `backend/`, `fluig-app/` e `portal/` (constituição, princípio II).
    Qualquer mudança começa aqui.

    ## Autenticação
    - `/api/fluig/*` → esquema **fluigAuth**, que aceita DOIS tokens da área Jotanunes (desde 1.2.0):
      1. JWT HS256 emitido pelo **Fluig** (claims `iss`, `aud`, `sub`=login, `name`, `email`, `iat`,
         `exp` e, opcional, `roles`). Ver `fluig-identity.md`.
      2. JWT HS256 do **login próprio** da área Jotanunes, emitido por `POST /api/fluig/auth/login`
         (`iss`=`jotanunes-docs`, segredo próprio; mesmas claims `sub`/`name`/`email`/`roles` e mais
         `uid`, `ver`, `troca_senha`). Revogado na hora quando o usuário interno é desativado, tem a
         senha trocada/redefinida, tem o papel alterado ou sai (→ 401 `NAO_AUTENTICADO`).
      As rotas e as regras de perfil são as mesmas para os dois tokens.
    - Rotas anônimas da área Jotanunes: `GET /api/fluig/auth/configuracao` e
      `POST /api/fluig/auth/login` (esta com limite de 10 requisições/min por IP).
    - Login próprio com `troca_senha=true`: somente `GET /api/fluig/me`,
      `POST /api/fluig/auth/trocar-senha` e `POST /api/fluig/auth/sair` respondem; as demais rotas
      `/api/fluig/*` devolvem 403 `TROCA_SENHA_OBRIGATORIA` (regra global, vale para toda rota
      `/api/fluig/*` autenticada; tem precedência sobre `SEM_PERMISSAO`).
    - Login próprio desligado (`Auth:LoginLocal:Habilitado=false`): `GET /api/fluig/auth/configuracao`
      devolve `loginLocalHabilitado=false`; login, troca de senha e sair respondem 404
      `NAO_ENCONTRADO`; tokens do login próprio → 401.
    - `/api/portal/*` → esquema **portalAuth**: JWT HS256 emitido por `POST /api/portal/auth/login`
      (claims `sub`=id da empresa, `cnpj`, `ver`, `troca_senha`).
    - Um token da área Jotanunes (Fluig ou login próprio) NUNCA é aceito no portal, nem o do portal
      na área Jotanunes (→ 401 `NAO_AUTENTICADO`).
    - Com `troca_senha=true`, somente `GET /api/portal/me` e `POST /api/portal/auth/trocar-senha`
      respondem; as demais rotas do portal devolvem 403 `TROCA_SENHA_OBRIGATORIA`.

    ## Perfis na área Jotanunes (desde 1.1.0)
    - **Administrador**: token (Fluig ou login próprio) com `roles` contendo `admin` (ver
      `fluig-identity.md`). Sem a claim, ou sem `admin` nela, o usuário é **comum**. No login próprio,
      o papel vem do cadastro do usuário interno.
    - Operações marcadas com `x-requer-admin: true` (cadastrar/editar/ativar/desativar obras,
      vínculos, empresas e tipos de documento; aprovar/rejeitar envios; desde 1.2.0, TODAS as rotas
      `/api/fluig/usuarios*`, inclusive as de leitura) exigem administrador.
      Usuário comum → 403 `SEM_PERMISSAO`, verificado ANTES de validar corpo ou procurar o recurso
      (sem efeito de negócio; só a tentativa fica na auditoria). As demais rotas `/api/fluig/*` (consultas, downloads e convites)
      valem para os dois perfis.
    - O perfil vem só do token atual: vale até o token expirar (máx. 8 h) — no login próprio, mudar o
      papel revoga o token. `GET /api/fluig/me` devolve `admin`, `origem` e `trocaSenhaObrigatoria`
      para o front esconder as ações e decidir as telas.

    ## Documentos por obra (desde 1.3.0, feature 002)
    - Todo tipo de documento tem `abrangencia`: `GERAL` (da empresa, vale em todas as obras) ou
      `POR_OBRA` (exigido só nas obras que o marcam; cada obra recebe o seu envio).
    - As rotas de documentos já existentes (`/empresas/{e}/documentos*`, `/portal/documentos*`)
      tratam só os documentos gerais; os da obra ficam em `/obras/{o}/...` (área Jotanunes e portal).
    - Desvincular empresa da obra encerra o vínculo (histórico preservado); vincular de novo reabre.
    - Detalhes: `specs/002-documentos-por-obra/contracts/mudancas-api.md`.

    ## Documentos periódicos (desde 1.4.0, feature 003)
    - Todo tipo de documento tem `periodicidade`: `UNICA` (um envio vale para sempre, como antes) ou
      periódica (`MESES` ou `DIAS`, com `intervalo` e `prazoDias` depois do fim de cada período).
    - Tipo periódico exige um envio por período; os períodos são calculados pela API (não são
      cadastrados) e listados em `.../documentos/{tipoDocumentoId}/periodos` (área Jotanunes e portal).
    - O envio de documento periódico informa `periodoInicio`; a situação do documento resume os
      períodos (atrasado primeiro) e `periodos` traz as contagens.
    - Mudar unidade/intervalo de tipo com envios → 409 `PERIODICIDADE_IMUTAVEL`.
    - Detalhes: `specs/003-documentos-periodicos/contracts/mudancas-api.md`.

    ## Convenções
    - JSON em camelCase; enums em MAIÚSCULAS; datas ISO 8601 em UTC.
    - Erros: `application/problem+json` (RFC 9457) com `code` estável (ver `CodigoErro`);
      `title`/`detail` em português, prontos para exibir.
    - Recurso de outra empresa → 404 `NAO_ENCONTRADO` (nunca 403).
    - Listas paginadas: `pagina` (≥1, padrão 1) e `tamanhoPagina` (1–100, padrão 20).
    - CNPJ na entrada: com ou sem máscara; na saída: sempre 14 caracteres sem máscara
      (numérico ou alfanumérico), a máscara é aplicada pelo front.
servers:
  - url: http://localhost:5080
    description: Desenvolvimento local
tags:
  - { name: 'Sistema', description: 'Saúde da API.' }
  - { name: 'Fluig - Sessão', description: 'Usuário atual da área Jotanunes e painel.' }
  - { name: 'Fluig - Acesso', description: 'Login próprio da área Jotanunes (login + senha), troca de senha e saída.' }
  - { name: 'Fluig - Usuários internos', description: 'Usuários do login próprio (só administradores).' }
  - { name: 'Fluig - Obras', description: 'Cadastro de obras e vínculos com empresas.' }
  - { name: 'Fluig - Empresas', description: 'Cadastro de empresas terceirizadas.' }
  - { name: 'Fluig - Convites', description: 'Convite por e-mail para o portal.' }
  - { name: 'Fluig - Tipos de documento', description: 'Catálogo de tipos de documento.' }
  - { name: 'Fluig - Análise', description: 'Situação dos documentos, fila e decisões.' }
  - { name: 'Portal - Acesso', description: 'Convite, login e troca de senha da empresa.' }
  - { name: 'Portal - Documentos', description: 'Documentos exigidos, envios e downloads da empresa.' }

paths:
  /health:
    get:
      tags: [Sistema]
      operationId: health
      summary: Verifica se a API está no ar (sem autenticação)
      security: []
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  # ───────────────────────────── FLUIG ─────────────────────────────
  /api/fluig/me:
    get:
      tags: [Fluig - Sessão]
      operationId: fluigObterUsuarioAtual
      summary: Dados do usuário da área Jotanunes identificado pelo token (perfil, origem e troca pendente)
      description: |
        Responde também com troca de senha pendente (login próprio), para o front mostrar a tela de troca.
      security: [{ fluigAuth: [] }]
      responses:
        '200':
          description: Usuário atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioFluig' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /api/fluig/auth/configuracao:
    get:
      tags: [Fluig - Acesso]
      operationId: fluigObterConfiguracaoAcesso
      summary: Diz se o login próprio da área Jotanunes está ligado (anônimo)
      description: |
        Sempre 200, sem autenticação, com `Cache-Control: no-store`. O front chama quando não tem
        token: `true` → tela de login; `false` → "Abra este sistema pelo Fluig.".
      security: []
      responses:
        '200':
          description: Configuração de acesso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracaoAcesso' }

  /api/fluig/auth/login:
    post:
      tags: [Fluig - Acesso]
      operationId: fluigLogin
      summary: Login próprio da área Jotanunes (login + senha de usuário interno)
      description: |
        Anônimo, com limite de 10 requisições/min por IP (mesma regra do login do portal).
        Login sem diferenciar maiúsculas (espaços nas pontas removidos).
        5 falhas seguidas no mesmo login — existente ou não — → bloqueio de 15 min (423 `ACESSO_BLOQUEADO`).
        `LOGIN_INVALIDO` não revela se o login existe (mesma mensagem e mesma sequência de respostas).
        Com senha provisória, a sessão volta com `usuario.trocaSenhaObrigatoria=true`.
        Login próprio desligado → 404 `NAO_ENCONTRADO`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginJotanunesInput' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoJotanunes' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401':
          description: '`LOGIN_INVALIDO` ou `SENHA_PROVISORIA_EXPIRADA` (senha certa, provisória vencida)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '403':
          description: '`USUARIO_INATIVO` (senha certa, usuário desativado)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '423':
          description: '`ACESSO_BLOQUEADO` (extensão `bloqueadoAte` com a data/hora de liberação)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '429': { $ref: '#/components/responses/LimiteRequisicoes' }

  /api/fluig/auth/trocar-senha:
    post:
      tags: [Fluig - Acesso]
      operationId: fluigTrocarSenha
      summary: Troca a senha do usuário interno (obrigatória no primeiro acesso) e devolve nova sessão
      description: |
        Só para sessão de login próprio (token Fluig → 409 `SO_LOGIN_LOCAL`). Permitida com
        `troca_senha=true`. Exige a senha atual; nova senha com 8–128 caracteres, letra e número,
        diferente da atual. Incrementa a versão da credencial (tokens anteriores deixam de valer) e
        devolve novo token com `troca_senha=false`. Login próprio desligado → 404.
      security: [{ fluigAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrocaSenhaInput' }
      responses:
        '200':
          description: Senha trocada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoJotanunes' }
        '400':
          description: '`VALIDACAO`, `SENHA_FRACA` ou `SENHA_ATUAL_INCORRETA`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: '`SO_LOGIN_LOCAL` (sessão aberta pelo Fluig)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/fluig/auth/sair:
    post:
      tags: [Fluig - Acesso]
      operationId: fluigSair
      summary: Encerra a sessão de login próprio (revoga o token na hora)
      description: |
        Incrementa a versão da credencial do usuário interno: o token atual (e outras sessões do mesmo
        usuário) passam a 401. Com token do Fluig → 204 sem efeito. Permitida com troca de senha
        pendente. Login próprio desligado → 404.
      security: [{ fluigAuth: [] }]
      responses:
        '204': { description: 'Sessão encerrada (ou nada a fazer, para token do Fluig)' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/fluig/painel:
    get:
      tags: [Fluig - Sessão]
      operationId: fluigObterPainel
      summary: Indicadores do painel inicial (US5)
      security: [{ fluigAuth: [] }]
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Painel' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }

  /api/fluig/obras:
    get:
      tags: [Fluig - Obras]
      operationId: fluigListarObras
      summary: Lista obras (ordenadas por nome)
      security: [{ fluigAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Busca' }
        - name: ativa
          in: query
          description: Filtra por ativa/inativa. Omitido = todas.
          schema: { type: boolean }
        - name: comPendencia
          in: query
          description: true = somente obras ativas com alguma empresa (vínculo ativo) com documento da obra pendente de envio ou rejeitado.
          schema: { type: boolean }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/TamanhoPagina' }
      responses:
        '200':
          description: Página de obras
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaObras' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
    post:
      tags: [Fluig - Obras]
      operationId: fluigCriarObra
      summary: Cadastra obra
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObraInput' }
      responses:
        '201':
          description: Obra criada
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Obra' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409':
          description: '`CODIGO_OBRA_DUPLICADO`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/fluig/obras/{obraId}:
    parameters:
      - { $ref: '#/components/parameters/ObraId' }
    get:
      tags: [Fluig - Obras]
      operationId: fluigObterObra
      summary: Detalhe da obra com empresas vinculadas e contagem de documentos
      security: [{ fluigAuth: [] }]
      responses:
        '200':
          description: Obra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObraDetalhe' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Fluig - Obras]
      operationId: fluigAtualizarObra
      summary: Atualiza obra (inclui ativar/desativar)
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObraAtualizacao' }
      responses:
        '200':
          description: Obra atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Obra' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: '`CODIGO_OBRA_DUPLICADO`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/fluig/obras/{obraId}/empresas/{empresaId}:
    parameters:
      - { $ref: '#/components/parameters/ObraId' }
      - { $ref: '#/components/parameters/EmpresaId' }
    put:
      tags: [Fluig - Obras]
      operationId: fluigVincularEmpresaObra
      summary: Vincula ou reabre o vínculo (idempotente)
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      responses:
        '204': { description: 'Vínculo ativo (criado agora, reaberto ou já existente)' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Fluig - Obras]
      operationId: fluigDesvincularEmpresaObra
      summary: Encerra o vínculo (histórico preservado)
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      responses:
        '204': { description: Vínculo encerrado (agora ou antes) }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/fluig/obras/{obraId}/tipos-documento:
    parameters:
      - { $ref: '#/components/parameters/ObraId' }
    get:
      tags: [Fluig - Obras]
      operationId: fluigListarTiposExigidosObra
      summary: Tipos POR_OBRA e se cada um é exigido nesta obra (ordenados por nome)
      description: Todos os tipos `POR_OBRA` ativos e, dos inativos, só os marcados na obra.
      security: [{ fluigAuth: [] }]
      responses:
        '200':
          description: Tipos da obra
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TipoExigidoObra' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/fluig/obras/{obraId}/tipos-documento/{tipoDocumentoId}:
    parameters:
      - { $ref: '#/components/parameters/ObraId' }
      - { $ref: '#/components/parameters/TipoDocumentoId' }
    put:
      tags: [Fluig - Obras]
      operationId: fluigMarcarTipoExigidoObra
      summary: Marca o tipo POR_OBRA como exigido nesta obra (idempotente)
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      responses:
        '204': { description: Tipo marcado (agora ou antes) }
        '400':
          description: '`TIPO_NAO_E_POR_OBRA` (tipo de abrangência GERAL)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Fluig - Obras]
      operationId: fluigDesmarcarTipoExigidoObra
      summary: Deixa de exigir o tipo nesta obra (idempotente; envios preservados)
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      responses:
        '204': { description: Tipo desmarcado (agora ou antes) }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/fluig/obras/{obraId}/empresas/{empresaId}/documentos:
    parameters:
      - { $ref: '#/components/parameters/ObraId' }
      - { $ref: '#/components/parameters/EmpresaId' }
    get:
      tags: [Fluig - Análise]
      operationId: fluigListarDocumentosEmpresaObra
      summary: Situação de cada documento da obra para a empresa (tipos marcados; ordenado por nome do tipo)
      description: |
        Responde também com vínculo encerrado (para histórico). Sem vínculo (ativo ou encerrado) → 404.
      security: [{ fluigAuth: [] }]
      responses:
        '200':
          description: Documentos da obra
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentoSituacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/fluig/obras/{obraId}/empresas/{empresaId}/documentos/{tipoDocumentoId}/envios:
    parameters:
      - { $ref: '#/components/parameters/ObraId' }
      - { $ref: '#/components/parameters/EmpresaId' }
      - { $ref: '#/components/parameters/TipoDocumentoId' }
    get:
      tags: [Fluig - Análise]
      operationId: fluigListarHistoricoEnviosEmpresaObra
      summary: Histórico de envios da empresa para o tipo nesta obra (mais recente primeiro; inclui tipos desmarcados)
      security: [{ fluigAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PeriodoInicio' }
      responses:
        '200':
          description: Envios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Envio' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/fluig/obras/{obraId}/empresas/{empresaId}/documentos/{tipoDocumentoId}/periodos:
    parameters:
      - { $ref: '#/components/parameters/ObraId' }
      - { $ref: '#/components/parameters/EmpresaId' }
      - { $ref: '#/components/parameters/TipoDocumentoId' }
    get:
      tags: [Fluig - Análise]
      operationId: fluigListarPeriodosEmpresaObra
      summary: Períodos exigidos do documento periódico da obra para a empresa (mais recente primeiro)
      description: |
        Responde também com vínculo encerrado (para histórico). Sem vínculo (ativo ou encerrado), tipo não
        marcado na obra ou de periodicidade `UNICA` → 404.
      security: [{ fluigAuth: [] }]
      responses:
        '200':
          description: Períodos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Periodo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/fluig/empresas:
    get:
      tags: [Fluig - Empresas]
      operationId: fluigListarEmpresas
      summary: Lista empresas (ordenadas por razão social)
      security: [{ fluigAuth: [] }]
      parameters:
        - name: busca
          in: query
          description: Trecho da razão social, nome fantasia ou CNPJ (com ou sem máscara).
          schema: { type: string, maxLength: 100 }
        - name: obraId
          in: query
          description: Somente empresas vinculadas a esta obra.
          schema: { type: string, format: uuid }
        - name: situacaoAcesso
          in: query
          schema: { $ref: '#/components/schemas/SituacaoAcesso' }
        - name: comPendencia
          in: query
          description: true = somente empresas com documento pendente de envio ou rejeitado.
          schema: { type: boolean }
        - name: comAtraso
          in: query
          description: true = somente empresas com algum período de documento periódico atrasado.
          schema: { type: boolean }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/TamanhoPagina' }
      responses:
        '200':
          description: Página de empresas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaEmpresas' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
    post:
      tags: [Fluig - Empresas]
      operationId: fluigCriarEmpresa
      summary: Cadastra empresa terceirizada
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmpresaInput' }
      responses:
        '201':
          description: Empresa criada (situação de acesso `NAO_CONVIDADA`)
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empresa' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409':
          description: '`CNPJ_DUPLICADO`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/fluig/empresas/{empresaId}:
    parameters:
      - { $ref: '#/components/parameters/EmpresaId' }
    get:
      tags: [Fluig - Empresas]
      operationId: fluigObterEmpresa
      summary: Detalhe da empresa
      security: [{ fluigAuth: [] }]
      responses:
        '200':
          description: Empresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empresa' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Fluig - Empresas]
      operationId: fluigAtualizarEmpresa
      summary: Atualiza empresa (inclui ativar/desativar)
      description: |
        Desativar incrementa a versão da credencial (sessões do portal caem na hora).
        Alterar o CNPJ depois do 1º convite → 409 `CNPJ_IMUTAVEL`.
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmpresaAtualizacao' }
      responses:
        '200':
          description: Empresa atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empresa' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: '`CNPJ_DUPLICADO` ou `CNPJ_IMUTAVEL`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/fluig/empresas/{empresaId}/convites:
    parameters:
      - { $ref: '#/components/parameters/EmpresaId' }
    get:
      tags: [Fluig - Convites]
      operationId: fluigListarConvites
      summary: Histórico de convites da empresa (mais recente primeiro)
      security: [{ fluigAuth: [] }]
      responses:
        '200':
          description: Convites
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Convite' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Fluig - Convites]
      operationId: fluigEnviarConvite
      summary: Envia (ou reenvia) o convite por e-mail
      description: |
        Permitido aos dois perfis (administrador e comum).
        Gera token de link (7 dias) e senha temporária, invalida convites anteriores, redefine o
        acesso (troca de senha obrigatória) e envia o e-mail ao `emailContato`.
        Se o e-mail falhar, nada é gravado (502 `EMAIL_FALHOU`).
      security: [{ fluigAuth: [] }]
      responses:
        '201':
          description: Convite enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Convite' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: '`EMPRESA_INATIVA`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '502':
          description: '`EMAIL_FALHOU`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/fluig/empresas/{empresaId}/documentos:
    parameters:
      - { $ref: '#/components/parameters/EmpresaId' }
    get:
      tags: [Fluig - Análise]
      operationId: fluigListarDocumentosEmpresa
      summary: Situação de cada tipo de documento ativo para a empresa (ordenado por nome do tipo)
      description: Só documentos gerais (tipos `GERAL` ativos). Os da obra ficam em `/obras/{obraId}/empresas/{empresaId}/documentos`.
      security: [{ fluigAuth: [] }]
      responses:
        '200':
          description: Documentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentoSituacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/fluig/empresas/{empresaId}/documentos/{tipoDocumentoId}/envios:
    parameters:
      - { $ref: '#/components/parameters/EmpresaId' }
      - { $ref: '#/components/parameters/TipoDocumentoId' }
    get:
      tags: [Fluig - Análise]
      operationId: fluigListarHistoricoEnvios
      summary: Histórico de envios da empresa para o tipo (mais recente primeiro; inclui tipos inativos)
      description: Só envios gerais. Tipo `POR_OBRA` → 404.
      security: [{ fluigAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PeriodoInicio' }
      responses:
        '200':
          description: Envios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Envio' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/fluig/empresas/{empresaId}/documentos/{tipoDocumentoId}/periodos:
    parameters:
      - { $ref: '#/components/parameters/EmpresaId' }
      - { $ref: '#/components/parameters/TipoDocumentoId' }
    get:
      tags: [Fluig - Análise]
      operationId: fluigListarPeriodosEmpresa
      summary: Períodos exigidos do documento geral periódico da empresa (mais recente primeiro)
      description: |
        Do início da cobrança até o período em curso. Tipo `POR_OBRA` ou de periodicidade `UNICA` → 404.
      security: [{ fluigAuth: [] }]
      responses:
        '200':
          description: Períodos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Periodo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/fluig/tipos-documento:
    get:
      tags: [Fluig - Tipos de documento]
      operationId: fluigListarTiposDocumento
      summary: Lista tipos de documento (ordenados por nome; sem paginação)
      security: [{ fluigAuth: [] }]
      parameters:
        - name: ativo
          in: query
          description: Filtra por ativo/inativo. Omitido = todos.
          schema: { type: boolean }
        - name: abrangencia
          in: query
          description: Filtra por abrangência. Omitido = todas.
          schema: { $ref: '#/components/schemas/Abrangencia' }
        - name: periodico
          in: query
          description: true = só tipos periódicos (MESES/DIAS); false = só UNICA. Omitido = todos.
          schema: { type: boolean }
      responses:
        '200':
          description: Tipos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TipoDocumento' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
    post:
      tags: [Fluig - Tipos de documento]
      operationId: fluigCriarTipoDocumento
      summary: Cadastra tipo de documento (GERAL é exigido de todas as empresas ativas; POR_OBRA, só nas obras que o marcarem)
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TipoDocumentoInput' }
      responses:
        '201':
          description: Tipo criado
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TipoDocumento' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409':
          description: '`NOME_DUPLICADO`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/fluig/tipos-documento/{tipoDocumentoId}:
    parameters:
      - { $ref: '#/components/parameters/TipoDocumentoId' }
    get:
      tags: [Fluig - Tipos de documento]
      operationId: fluigObterTipoDocumento
      summary: Detalhe do tipo de documento
      security: [{ fluigAuth: [] }]
      responses:
        '200':
          description: Tipo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TipoDocumento' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Fluig - Tipos de documento]
      operationId: fluigAtualizarTipoDocumento
      summary: Atualiza tipo de documento (inclui ativar/desativar)
      description: |
        Aceita `abrangencia`. Trocar a abrangência de tipo que já tem envios → 409 `ABRANGENCIA_IMUTAVEL`.
        Aceita `periodicidade` (desde 1.4.0). Mudar unidade ou intervalo de tipo que já tem envios →
        409 `PERIODICIDADE_IMUTAVEL`; `prazoDias` pode mudar sempre. `periodicidade` omitida (ou null) = mantém a atual.
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TipoDocumentoAtualizacao' }
      responses:
        '200':
          description: Tipo atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TipoDocumento' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: '`NOME_DUPLICADO`, `ABRANGENCIA_IMUTAVEL` ou `PERIODICIDADE_IMUTAVEL`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/fluig/envios:
    get:
      tags: [Fluig - Análise]
      operationId: fluigListarEnvios
      summary: Fila de análise / busca de envios
      description: |
        Padrão `status=EM_ANALISE`, ordenado do envio mais antigo para o mais novo.
        Para `APROVADO`/`REJEITADO`, ordenado do mais recente para o mais antigo.
      security: [{ fluigAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            allOf: [{ $ref: '#/components/schemas/StatusEnvio' }]
            default: EM_ANALISE
        - name: obraId
          in: query
          description: Somente envios desta obra (documentos da obra). Não combina com `somenteGerais` (400).
          schema: { type: string, format: uuid }
        - name: somenteGerais
          in: query
          description: true = somente envios de documentos gerais (sem obra). Não combina com `obraId` (400).
          schema: { type: boolean }
        - name: empresaId
          in: query
          schema: { type: string, format: uuid }
        - name: tipoDocumentoId
          in: query
          schema: { type: string, format: uuid }
        - name: comAtraso
          in: query
          description: true = somente envios feitos depois do prazo do período (`enviadoComAtraso`).
          schema: { type: boolean }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/TamanhoPagina' }
      responses:
        '200':
          description: Página de envios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaEnvios' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }

  /api/fluig/envios/{envioId}:
    parameters:
      - { $ref: '#/components/parameters/EnvioId' }
    get:
      tags: [Fluig - Análise]
      operationId: fluigObterEnvio
      summary: Detalhe de um envio
      security: [{ fluigAuth: [] }]
      responses:
        '200':
          description: Envio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvioFila' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/fluig/envios/{envioId}/arquivo:
    parameters:
      - { $ref: '#/components/parameters/EnvioId' }
    get:
      tags: [Fluig - Análise]
      operationId: fluigBaixarArquivoEnvio
      summary: Baixa o arquivo do envio (registra auditoria ARQUIVO_BAIXADO)
      security: [{ fluigAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Arquivo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/fluig/envios/{envioId}/aprovar:
    parameters:
      - { $ref: '#/components/parameters/EnvioId' }
    post:
      tags: [Fluig - Análise]
      operationId: fluigAprovarEnvio
      summary: Aprova um envio EM_ANALISE
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      responses:
        '200':
          description: Envio aprovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envio' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: '`ENVIO_JA_ANALISADO`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/fluig/envios/{envioId}/rejeitar:
    parameters:
      - { $ref: '#/components/parameters/EnvioId' }
    post:
      tags: [Fluig - Análise]
      operationId: fluigRejeitarEnvio
      summary: Rejeita um envio EM_ANALISE com motivo (envia e-mail de aviso à empresa)
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Rejeicao' }
      responses:
        '200':
          description: Envio rejeitado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envio' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: '`ENVIO_JA_ANALISADO`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/fluig/usuarios:
    get:
      tags: [Fluig - Usuários internos]
      operationId: fluigListarUsuariosInternos
      summary: Lista usuários internos (ordenados por nome)
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      parameters:
        - name: busca
          in: query
          description: Trecho do nome, login ou e-mail (sem diferenciar maiúsculas/acentos).
          schema: { type: string, maxLength: 100 }
        - name: ativo
          in: query
          description: Filtra por ativo/desativado. Omitido = todos.
          schema: { type: boolean }
        - name: admin
          in: query
          description: Filtra por perfil (true = administradores). Omitido = todos.
          schema: { type: boolean }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/TamanhoPagina' }
      responses:
        '200':
          description: Página de usuários internos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaUsuariosInternos' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Fluig - Usuários internos]
      operationId: fluigCriarUsuarioInterno
      summary: Cadastra usuário interno e envia a senha provisória por e-mail
      description: |
        Gera senha provisória (12 caracteres, vale 7 dias, troca obrigatória no primeiro acesso) e
        envia o e-mail de acesso ao `email`. A senha NUNCA volta na resposta. Se o e-mail falhar,
        nada é gravado (502 `EMAIL_ACESSO_FALHOU`).
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioInternoInput' }
      responses:
        '201':
          description: Usuário criado (situação `AGUARDANDO_PRIMEIRO_ACESSO`)
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioInterno' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409':
          description: '`LOGIN_DUPLICADO`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '502':
          description: '`EMAIL_ACESSO_FALHOU`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/fluig/usuarios/{usuarioId}:
    parameters:
      - { $ref: '#/components/parameters/UsuarioId' }
    get:
      tags: [Fluig - Usuários internos]
      operationId: fluigObterUsuarioInterno
      summary: Detalhe do usuário interno
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      responses:
        '200':
          description: Usuário interno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioInterno' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Fluig - Usuários internos]
      operationId: fluigAtualizarUsuarioInterno
      summary: Atualiza nome, e-mail, perfil e ativação do usuário interno (o login não muda)
      description: |
        Mudar `admin` ou `ativo` revoga na hora as sessões do usuário (versão da credencial + 1).
        Recusas: a sessão de login próprio desativando a si mesma ou tirando o próprio papel →
        409 `ALTERACAO_PROPRIA_NAO_PERMITIDA`; deixaria o sistema sem nenhum usuário interno
        administrador ativo → 409 `ULTIMO_ADMINISTRADOR`.
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioInternoAtualizacao' }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioInterno' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: '`ULTIMO_ADMINISTRADOR` ou `ALTERACAO_PROPRIA_NAO_PERMITIDA`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/fluig/usuarios/{usuarioId}/redefinir-senha:
    parameters:
      - { $ref: '#/components/parameters/UsuarioId' }
    post:
      tags: [Fluig - Usuários internos]
      operationId: fluigRedefinirSenhaUsuarioInterno
      summary: Gera nova senha provisória e envia por e-mail
      description: |
        Nova senha provisória (7 dias, troca obrigatória), zera tentativas/bloqueio e revoga as
        sessões do usuário. Usuário desativado → 409 `USUARIO_INATIVO`. Se o e-mail falhar, nada
        muda (502 `EMAIL_ACESSO_FALHOU`). A senha NUNCA volta na resposta.
      security: [{ fluigAuth: [] }]
      x-requer-admin: true
      responses:
        '200':
          description: Senha redefinida (situação `AGUARDANDO_PRIMEIRO_ACESSO`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioInterno' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: '`USUARIO_INATIVO`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '502':
          description: '`EMAIL_ACESSO_FALHOU`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  # ───────────────────────────── PORTAL ─────────────────────────────
  /api/portal/convites/validar:
    post:
      tags: [Portal - Acesso]
      operationId: portalValidarConvite
      summary: Valida o link do convite e devolve dados para pré-preencher a tela de acesso
      description: |
        Anônimo, com limite de 10 requisições/min por IP.
        O token do convite é um segredo de acesso: vai no CORPO da requisição (nunca no caminho nem na
        query string), para não aparecer em logs de proxy/servidor, histórico ou cabeçalhos `Referer`.
        Token ausente, vazio ou fora do tamanho → 404 `CONVITE_INVALIDO` (mesma resposta de um token inexistente);
        400 `VALIDACAO` só quando o corpo não é um JSON legível.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConviteValidacaoInput' }
      responses:
        '200':
          description: Convite válido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConviteValidacao' }
        '400': { $ref: '#/components/responses/Validacao' }
        '404':
          description: '`CONVITE_INVALIDO` (inexistente, expirado, usado ou substituído)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '429': { $ref: '#/components/responses/LimiteRequisicoes' }

  /api/portal/auth/login:
    post:
      tags: [Portal - Acesso]
      operationId: portalLogin
      summary: Acesso da empresa por CNPJ + senha
      description: |
        Anônimo, com limite de 10 requisições/min por IP.
        5 falhas seguidas no mesmo CNPJ → bloqueio de 15 min (423 `ACESSO_BLOQUEADO`).
        Mensagem de `CREDENCIAIS_INVALIDAS` não revela se o CNPJ existe.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoPortal' }
        '400': { $ref: '#/components/responses/Validacao' }
        '401':
          description: '`CREDENCIAIS_INVALIDAS` ou `CONVITE_EXPIRADO` (senha temporária vencida)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '403':
          description: '`EMPRESA_INATIVA` (credenciais corretas, empresa desativada)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '423':
          description: '`ACESSO_BLOQUEADO` (extensão `bloqueadoAte` com a data/hora de liberação)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '429': { $ref: '#/components/responses/LimiteRequisicoes' }

  /api/portal/auth/trocar-senha:
    post:
      tags: [Portal - Acesso]
      operationId: portalTrocarSenha
      summary: Troca a senha (obrigatória no primeiro acesso) e devolve nova sessão
      description: |
        Permitida com `troca_senha=true`. Marca o convite como usado, incrementa a versão da
        credencial (tokens anteriores deixam de valer) e devolve novo token com `troca_senha=false`.
      security: [{ portalAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrocaSenhaInput' }
      responses:
        '200':
          description: Senha trocada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoPortal' }
        '400':
          description: '`VALIDACAO`, `SENHA_FRACA` ou `SENHA_ATUAL_INCORRETA`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /api/portal/me:
    get:
      tags: [Portal - Acesso]
      operationId: portalObterEmpresaAtual
      summary: Dados da empresa autenticada (permitido com troca de senha pendente)
      security: [{ portalAuth: [] }]
      responses:
        '200':
          description: Empresa atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmpresaPortal' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /api/portal/documentos:
    get:
      tags: [Portal - Documentos]
      operationId: portalListarDocumentos
      summary: Documentos exigidos da empresa autenticada e a situação de cada um
      description: |
        Só documentos gerais: todos os tipos `GERAL` ativos, ordenados por situação (REJEITADO,
        PENDENTE_ENVIO, EM_ANALISE, APROVADO) e nome. Os da obra ficam em `/api/portal/obras/{obraId}/documentos`.
      security: [{ portalAuth: [] }]
      responses:
        '200':
          description: Documentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentoSituacaoPortal' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }

  /api/portal/documentos/{tipoDocumentoId}/envios:
    parameters:
      - { $ref: '#/components/parameters/TipoDocumentoId' }
    get:
      tags: [Portal - Documentos]
      operationId: portalListarHistoricoEnvios
      summary: Histórico de envios da própria empresa para o tipo (mais recente primeiro)
      description: Só tipo `GERAL` (envios gerais). Tipo `POR_OBRA` → 404.
      security: [{ portalAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PeriodoInicio' }
      responses:
        '200':
          description: Envios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnvioPortal' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Portal - Documentos]
      operationId: portalEnviarDocumento
      summary: Envia arquivo para o tipo de documento (PDF, JPEG ou PNG, até 10 MB)
      description: |
        Permitido somente quando a situação é `PENDENTE_ENVIO` ou `REJEITADO` e o tipo está ativo.
        O formato é validado pelo conteúdo do arquivo (assinatura de bytes), não pela extensão.
        Só tipo `GERAL`; tipo `POR_OBRA` → 404 (use `/api/portal/obras/{obraId}/documentos/{tipoDocumentoId}/envios`).
        Tipo periódico (desde 1.4.0): `periodoInicio` indica o período; a situação e o `podeEnviar` são
        os desse período. Período não exigido (futuro, anterior ao início da cobrança ou data que não é
        início de período) → 404.
      security: [{ portalAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
                periodoInicio:
                  type: string
                  format: date
                  description: Início do período do envio. Obrigatório para tipo periódico; proibido para tipo único (→ 400 `PERIODO_OBRIGATORIO`).
      responses:
        '201':
          description: Envio registrado (status `EM_ANALISE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvioPortal' }
        '400':
          description: '`VALIDACAO` (campo ausente), `ARQUIVO_INVALIDO` (vazio/corrompido) ou `PERIODO_OBRIGATORIO`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: '`ENVIO_NAO_PERMITIDO` (documento em análise ou aprovado)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '413':
          description: '`ARQUIVO_MUITO_GRANDE`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '415':
          description: '`ARQUIVO_TIPO_NAO_SUPORTADO`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/portal/documentos/{tipoDocumentoId}/periodos:
    parameters:
      - { $ref: '#/components/parameters/TipoDocumentoId' }
    get:
      tags: [Portal - Documentos]
      operationId: portalListarPeriodos
      summary: Períodos exigidos do documento geral periódico da própria empresa (mais recente primeiro)
      description: |
        Diz, para cada período, a situação, se está atrasado e se dá para enviar. Tipo `POR_OBRA` ou de
        periodicidade `UNICA` → 404.
      security: [{ portalAuth: [] }]
      responses:
        '200':
          description: Períodos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PeriodoPortal' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/portal/obras:
    get:
      tags: [Portal - Documentos]
      operationId: portalListarObras
      summary: Obras da empresa autenticada com a contagem dos documentos de cada uma
      description: |
        Obras ativas com vínculo ativo da empresa do token. Ordem: com pendência primeiro, depois nome.
      security: [{ portalAuth: [] }]
      responses:
        '200':
          description: Obras
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ObraPortal' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }

  /api/portal/obras/{obraId}/documentos:
    parameters:
      - { $ref: '#/components/parameters/ObraId' }
    get:
      tags: [Portal - Documentos]
      operationId: portalListarDocumentosObra
      summary: Documentos exigidos da empresa nesta obra e a situação de cada um
      description: |
        Tipos marcados e ativos na obra, ordenados por situação (REJEITADO, PENDENTE_ENVIO, EM_ANALISE,
        APROVADO) e nome. `{obraId}` só é resolvido entre obras ativas com vínculo ativo da empresa do
        token; fora disso → 404.
      security: [{ portalAuth: [] }]
      responses:
        '200':
          description: Documentos da obra
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentoSituacaoPortal' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/portal/obras/{obraId}/documentos/{tipoDocumentoId}/envios:
    parameters:
      - { $ref: '#/components/parameters/ObraId' }
      - { $ref: '#/components/parameters/TipoDocumentoId' }
    get:
      tags: [Portal - Documentos]
      operationId: portalListarHistoricoObra
      summary: Histórico de envios da própria empresa para o tipo nesta obra (mais recente primeiro)
      description: Obra fora do alcance da empresa (sem vínculo ativo ou inativa) ou tipo não marcado → 404.
      security: [{ portalAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PeriodoInicio' }
      responses:
        '200':
          description: Envios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnvioPortal' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Portal - Documentos]
      operationId: portalEnviarDocumentoObra
      summary: Envia arquivo para o documento da obra (PDF, JPEG ou PNG, até 10 MB)
      description: |
        Mesmas regras de `POST /api/portal/documentos/{tipoDocumentoId}/envios`, para o documento desta
        obra: permitido somente quando a situação é `PENDENTE_ENVIO` ou `REJEITADO` e o documento é
        exigido (tipo ativo e marcado na obra). Obra fora do alcance da empresa ou tipo não marcado → 404.
        Tipo periódico: mesmas regras de `periodoInicio` do envio geral.
      security: [{ portalAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
                periodoInicio:
                  type: string
                  format: date
                  description: Início do período do envio. Obrigatório para tipo periódico; proibido para tipo único (→ 400 `PERIODO_OBRIGATORIO`).
      responses:
        '201':
          description: Envio registrado (status `EM_ANALISE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvioPortal' }
        '400':
          description: '`VALIDACAO` (campo ausente), `ARQUIVO_INVALIDO` (vazio/corrompido) ou `PERIODO_OBRIGATORIO`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: '`ENVIO_NAO_PERMITIDO` (documento em análise ou aprovado)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '413':
          description: '`ARQUIVO_MUITO_GRANDE`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '415':
          description: '`ARQUIVO_TIPO_NAO_SUPORTADO`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/portal/obras/{obraId}/documentos/{tipoDocumentoId}/periodos:
    parameters:
      - { $ref: '#/components/parameters/ObraId' }
      - { $ref: '#/components/parameters/TipoDocumentoId' }
    get:
      tags: [Portal - Documentos]
      operationId: portalListarPeriodosObra
      summary: Períodos exigidos do documento periódico da obra para a própria empresa (mais recente primeiro)
      description: |
        Mesmo isolamento de `/api/portal/obras/{obraId}/documentos`: obra fora do alcance da empresa (sem
        vínculo ativo ou inativa), tipo não marcado ou de periodicidade `UNICA` → 404.
      security: [{ portalAuth: [] }]
      responses:
        '200':
          description: Períodos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PeriodoPortal' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/portal/envios/{envioId}/arquivo:
    parameters:
      - { $ref: '#/components/parameters/EnvioId' }
    get:
      tags: [Portal - Documentos]
      operationId: portalBaixarArquivoEnvio
      summary: Baixa arquivo de um envio da própria empresa (outra empresa → 404)
      description: Envio de obra exige vínculo ativo com a obra e obra ativa; senão 404.
      security: [{ portalAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Arquivo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/TrocaSenhaObrigatoria' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

components:
  securitySchemes:
    fluigAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token da área Jotanunes, de uma de duas origens (o emissor `iss` decide qual validação vale):
        (1) JWT HS256 emitido pelo Fluig. `iss`=Auth__Fluig__Issuer (padrão `fluig`),
        `aud`=Auth__Fluig__Audience (padrão `jotanunes-docs-api`), `sub`=login, `name`, `email`,
        `exp` ≤ 8 h após `iat`; `roles` (opcional, lista de textos) com `admin` = administrador.
        (2) JWT HS256 do login próprio, emitido por `/api/fluig/auth/login` ou
        `/api/fluig/auth/trocar-senha`: `iss`=`jotanunes-docs`, `aud`=`jotanunes-docs-api`, segredo
        `Auth__LoginLocal__Secret`, `sub`=login, `name`, `email`, `roles` (`["admin"]` ou ausente),
        `uid`, `ver`, `troca_senha`; 8 h; revogável.
        Ver `contracts/fluig-identity.md`.
    portalAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT HS256 emitido por `/api/portal/auth/login` ou `/api/portal/auth/trocar-senha`.
        `iss`=`aud`=`jotanunes-docs-portal`, `sub`=id da empresa, `cnpj`, `ver`, `troca_senha`; 8 h.

  parameters:
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    TamanhoPagina:
      name: tamanhoPagina
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Busca:
      name: busca
      in: query
      description: Trecho do nome, código ou cidade (sem diferenciar maiúsculas/acentos).
      schema: { type: string, maxLength: 100 }
    ObraId:
      name: obraId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmpresaId:
      name: empresaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TipoDocumentoId:
      name: tipoDocumentoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnvioId:
      name: envioId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PeriodoInicio:
      name: periodoInicio
      in: query
      description: Só os envios do período que começa nesta data (documentos periódicos). Omitido = todos.
      schema: { type: string, format: date }

  responses:
    Validacao:
      description: '`VALIDACAO` — dados inválidos; `errors` traz as mensagens por campo'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: https://jotanunes.com/problemas/validacao
            title: Confira os dados informados.
            status: 400
            code: VALIDACAO
            errors:
              cnpj: [CNPJ inválido.]
    NaoAutenticado:
      description: '`NAO_AUTENTICADO` — token ausente, inválido, expirado, revogado ou do outro esquema'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    TrocaSenhaObrigatoria:
      description: '`TROCA_SENHA_OBRIGATORIA` — a empresa (portal) ou o usuário interno (login próprio da área Jotanunes) precisa trocar a senha antes de continuar'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SemPermissao:
      description: '`SEM_PERMISSAO` — operação só para administradores; o token (Fluig ou login próprio) não tem `roles` com `admin`. Com login próprio e troca de senha pendente, esta rota devolve antes `TROCA_SENHA_OBRIGATORIA` (mesmo status 403)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: https://jotanunes.com/problemas/sem-permissao
            title: Só administradores podem fazer isso. Se você precisa, fale com a TI.
            status: 403
            code: SEM_PERMISSAO
    NaoEncontrado:
      description: '`NAO_ENCONTRADO` — recurso inexistente ou de outra empresa'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    LimiteRequisicoes:
      description: '`LIMITE_REQUISICOES` — muitas tentativas; header Retry-After em segundos'
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Arquivo:
      description: |
        Conteúdo do arquivo. Headers: `Content-Disposition: attachment; filename*=UTF-8''<nome>`,
        `X-Content-Type-Options: nosniff`, `Cache-Control: no-store`.
      headers:
        Content-Disposition: { schema: { type: string } }
      content:
        application/pdf:
          schema: { type: string, format: binary }
        image/jpeg:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }

  schemas:
    # ── Erros e paginação ──
    CodigoErro:
      type: string
      enum:
        - VALIDACAO
        - NAO_AUTENTICADO
        - TROCA_SENHA_OBRIGATORIA
        - SEM_PERMISSAO
        - NAO_ENCONTRADO
        - CNPJ_DUPLICADO
        - CNPJ_IMUTAVEL
        - CODIGO_OBRA_DUPLICADO
        - NOME_DUPLICADO
        - EMPRESA_INATIVA
        - CREDENCIAIS_INVALIDAS
        - ACESSO_BLOQUEADO
        - CONVITE_INVALIDO
        - CONVITE_EXPIRADO
        - SENHA_FRACA
        - SENHA_ATUAL_INCORRETA
        - ENVIO_NAO_PERMITIDO
        - ENVIO_JA_ANALISADO
        - ARQUIVO_INVALIDO
        - ARQUIVO_MUITO_GRANDE
        - ARQUIVO_TIPO_NAO_SUPORTADO
        - EMAIL_FALHOU
        - LIMITE_REQUISICOES
        - ERRO_INTERNO
        - LOGIN_INVALIDO
        - USUARIO_INATIVO
        - SENHA_PROVISORIA_EXPIRADA
        - LOGIN_DUPLICADO
        - ULTIMO_ADMINISTRADOR
        - ALTERACAO_PROPRIA_NAO_PERMITIDA
        - EMAIL_ACESSO_FALHOU
        - SO_LOGIN_LOCAL
        - ABRANGENCIA_IMUTAVEL
        - TIPO_NAO_E_POR_OBRA
        - PERIODICIDADE_IMUTAVEL
        - PERIODO_OBRIGATORIO
      description: |
        | code | status | mensagem padrão (title) |
        |---|---|---|
        | VALIDACAO | 400 | Confira os dados informados. |
        | NAO_AUTENTICADO | 401 | Sua sessão expirou. Entre de novo. |
        | TROCA_SENHA_OBRIGATORIA | 403 | Crie uma nova senha para continuar. (portal e login próprio da área Jotanunes) |
        | SEM_PERMISSAO | 403 | Só administradores podem fazer isso. Se você precisa, fale com a TI. |
        | NAO_ENCONTRADO | 404 | Não encontramos o que você procurou. |
        | CNPJ_DUPLICADO | 409 | Já existe uma empresa com este CNPJ. |
        | CNPJ_IMUTAVEL | 409 | O CNPJ não pode ser alterado depois do convite. |
        | CODIGO_OBRA_DUPLICADO | 409 | Já existe uma obra com este código. |
        | NOME_DUPLICADO | 409 | Já existe um tipo de documento com este nome. |
        | EMPRESA_INATIVA | 409 (Fluig) / 403 (login) | Esta empresa está desativada. |
        | CREDENCIAIS_INVALIDAS | 401 | CNPJ ou senha incorretos. |
        | ACESSO_BLOQUEADO | 423 | Muitas tentativas. Tente de novo em 15 minutos. (portal e login próprio) |
        | CONVITE_INVALIDO | 404 | Este link não é mais válido. |
        | CONVITE_EXPIRADO | 401 | Seu convite expirou. Peça um novo convite à Jotanunes. |
        | SENHA_FRACA | 400 | A senha precisa ter pelo menos 8 caracteres, com letras e números. |
        | SENHA_ATUAL_INCORRETA | 400 | A senha atual não confere. |
        | ENVIO_NAO_PERMITIDO | 409 | Este documento já está em análise ou aprovado. |
        | ENVIO_JA_ANALISADO | 409 | Este envio já foi analisado. |
        | ARQUIVO_INVALIDO | 400 | Não conseguimos ler este arquivo. |
        | ARQUIVO_MUITO_GRANDE | 413 | O arquivo passa de 10 MB. |
        | ARQUIVO_TIPO_NAO_SUPORTADO | 415 | Envie um arquivo PDF, JPG ou PNG. |
        | EMAIL_FALHOU | 502 | Não conseguimos enviar o convite. Tente de novo em alguns minutos. |
        | LIMITE_REQUISICOES | 429 | Muitas tentativas. Aguarde um pouco. |
        | ERRO_INTERNO | 500 | Algo deu errado do nosso lado. Tente de novo. |
        | LOGIN_INVALIDO | 401 | Login ou senha incorretos. |
        | USUARIO_INATIVO | 403 (login) / 409 (redefinir senha) | Este usuário está desativado. Fale com um administrador do sistema. |
        | SENHA_PROVISORIA_EXPIRADA | 401 | Sua senha provisória expirou. Peça a um administrador para gerar outra. |
        | LOGIN_DUPLICADO | 409 | Já existe um usuário com este login. |
        | ULTIMO_ADMINISTRADOR | 409 | O sistema precisa de pelo menos um administrador ativo. |
        | ALTERACAO_PROPRIA_NAO_PERMITIDA | 409 | Você não pode desativar nem tirar o seu próprio acesso de administrador. Peça a outro administrador. |
        | EMAIL_ACESSO_FALHOU | 502 | Não conseguimos enviar o e-mail com a senha provisória. Tente de novo em alguns minutos. |
        | SO_LOGIN_LOCAL | 409 | Esta opção é só para quem entra com login e senha. |
        | ABRANGENCIA_IMUTAVEL | 409 | A abrangência não pode ser alterada porque este tipo já tem envios. |
        | TIPO_NAO_E_POR_OBRA | 400 | Só tipos de documento por obra podem ser exigidos de uma obra. |
        | PERIODICIDADE_IMUTAVEL | 409 | A periodicidade só pode mudar enquanto o tipo não tiver envios. |
        | PERIODO_OBRIGATORIO | 400 | Informe o período do envio (só para documentos periódicos). |
    Problema:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: 'https://jotanunes.com/problemas/nao-encontrado' }
        title: { type: string, description: Mensagem curta para o usuário (pt-BR). }
        status: { type: integer }
        detail: { type: string, nullable: true }
        instance: { type: string, nullable: true }
        code: { $ref: '#/components/schemas/CodigoErro' }
        errors:
          type: object
          nullable: true
          description: Somente em VALIDACAO. Chave = nome do campo (camelCase).
          additionalProperties:
            type: array
            items: { type: string }
        bloqueadoAte:
          type: string
          format: date-time
          nullable: true
          description: Somente em ACESSO_BLOQUEADO.
        traceId: { type: string, nullable: true }
    PaginaBase:
      type: object
      required: [total, pagina, tamanhoPagina]
      properties:
        total: { type: integer, minimum: 0 }
        pagina: { type: integer, minimum: 1 }
        tamanhoPagina: { type: integer, minimum: 1, maximum: 100 }

    # ── Enums ──
    Uf:
      type: string
      enum: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
    SituacaoAcesso:
      type: string
      enum: [NAO_CONVIDADA, CONVIDADA, CONVITE_EXPIRADO, ATIVA, DESATIVADA]
    SituacaoConvite:
      type: string
      enum: [VALIDO, USADO, EXPIRADO, SUBSTITUIDO]
    StatusEnvio:
      type: string
      enum: [EM_ANALISE, APROVADO, REJEITADO]
    SituacaoDocumento:
      type: string
      enum: [PENDENTE_ENVIO, EM_ANALISE, APROVADO, REJEITADO]
    FormatoArquivo:
      type: string
      enum: [application/pdf, image/jpeg, image/png]
    Abrangencia:
      type: string
      enum: [GERAL, POR_OBRA]
      description: GERAL = da empresa, vale em todas as obras. POR_OBRA = cada obra exige e recebe o seu envio.
    UnidadePeriodicidade:
      type: string
      enum: [UNICA, MESES, DIAS]
      description: UNICA = um envio vale para sempre. MESES/DIAS = um envio por período de `intervalo` meses/dias.

    # ── Fluig: sessão ──
    UsuarioFluig:
      type: object
      description: |
        Usuário atual da área Jotanunes (nome histórico do schema: desde 1.2.0 representa também a
        sessão do login próprio).
      required: [login, nome, email, admin, origem, trocaSenhaObrigatoria]
      properties:
        login: { type: string }
        nome: { type: string }
        email: { type: string }
        admin:
          type: boolean
          description: |
            true quando o token traz `roles` com `admin`. O front usa para esconder as ações
            de administrador; a API confere o papel em toda operação `x-requer-admin`.
        origem: { $ref: '#/components/schemas/OrigemSessao' }
        trocaSenhaObrigatoria:
          type: boolean
          description: Só no login próprio (senha provisória ainda não trocada). Sempre false para o Fluig.
    OrigemSessao:
      type: string
      enum: [FLUIG, LOGIN_LOCAL]
      description: '`FLUIG` = token emitido pelo Fluig; `LOGIN_LOCAL` = login próprio (mostra "Sair" e "Trocar senha").'
    ConfiguracaoAcesso:
      type: object
      required: [loginLocalHabilitado]
      properties:
        loginLocalHabilitado: { type: boolean }
    LoginJotanunesInput:
      type: object
      required: [login, senha]
      properties:
        login: { type: string, minLength: 1, maxLength: 100 }
        senha: { type: string, minLength: 1, maxLength: 128 }
    SessaoJotanunes:
      type: object
      required: [accessToken, expiraEm, usuario]
      properties:
        accessToken: { type: string, description: 'JWT fluigAuth do login próprio (iss=jotanunes-docs).' }
        expiraEm: { type: string, format: date-time }
        usuario: { $ref: '#/components/schemas/UsuarioFluig' }

    # ── Usuários internos (login próprio) ──
    SituacaoUsuarioInterno:
      type: string
      enum: [AGUARDANDO_PRIMEIRO_ACESSO, SENHA_PROVISORIA_EXPIRADA, ATIVO, DESATIVADO]
    UsuarioInternoInput:
      type: object
      required: [login, nome, email]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[A-Za-z0-9._-]{3,100}$'
          description: Único sem diferenciar maiúsculas; gravado em minúsculas; não pode ser alterado depois.
        nome: { type: string, minLength: 3, maxLength: 150 }
        email: { type: string, format: email, maxLength: 254 }
        admin: { type: boolean, default: false }
    UsuarioInternoAtualizacao:
      type: object
      required: [nome, email, admin, ativo]
      properties:
        nome: { type: string, minLength: 3, maxLength: 150 }
        email: { type: string, format: email, maxLength: 254 }
        admin: { type: boolean }
        ativo: { type: boolean }
    UsuarioInterno:
      type: object
      required: [id, login, nome, email, admin, ativo, situacao, criadoEm, criadoPor]
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
        nome: { type: string }
        email: { type: string }
        admin: { type: boolean }
        ativo: { type: boolean }
        situacao: { $ref: '#/components/schemas/SituacaoUsuarioInterno' }
        senhaProvisoriaExpiraEm: { type: string, format: date-time, nullable: true }
        bloqueadoAte:
          type: string
          format: date-time
          nullable: true
          description: Preenchido enquanto o login estiver bloqueado por tentativas erradas.
        ultimoAcessoEm: { type: string, format: date-time, nullable: true }
        criadoEm: { type: string, format: date-time }
        criadoPor: { type: string, description: 'Login de quem cadastrou, ou `sistema` (comando de instalação).' }
        atualizadoEm: { type: string, format: date-time, nullable: true }
    PaginaUsuariosInternos:
      allOf:
        - { $ref: '#/components/schemas/PaginaBase' }
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/UsuarioInterno' }
    AutorFluig:
      type: object
      required: [login, nome]
      properties:
        login: { type: string }
        nome: { type: string }
    Painel:
      type: object
      required: [enviosEmAnalise, empresasComPendencia, empresasConvidadasSemAcesso, empresasAtivas, obrasAtivas, obrasComPendencia, empresasComAtraso]
      properties:
        enviosEmAnalise: { type: integer, minimum: 0 }
        empresasComPendencia:
          type: integer
          minimum: 0
          description: |
            Empresas ativas com ao menos um documento PENDENTE_ENVIO ou REJEITADO — geral ou da obra
            (em obra ativa com vínculo ativo).
        obrasComPendencia:
          type: integer
          minimum: 0
          description: Obras ativas com alguma empresa ativa (vínculo ativo) com documento da obra PENDENTE_ENVIO ou REJEITADO.
        empresasConvidadasSemAcesso:
          type: integer
          minimum: 0
          description: Empresas com situação CONVIDADA ou CONVITE_EXPIRADO.
        empresasAtivas: { type: integer, minimum: 0 }
        obrasAtivas: { type: integer, minimum: 0 }
        empresasComAtraso:
          type: integer
          minimum: 0
          description: Empresas ativas com algum período de documento periódico atrasado (geral ou da obra).

    # ── Obras ──
    ObraInput:
      type: object
      required: [nome, cidade, uf]
      properties:
        nome: { type: string, minLength: 3, maxLength: 150 }
        codigo: { type: string, maxLength: 30, nullable: true }
        cidade: { type: string, minLength: 2, maxLength: 100 }
        uf: { $ref: '#/components/schemas/Uf' }
    ObraAtualizacao:
      allOf:
        - $ref: '#/components/schemas/ObraInput'
        - type: object
          required: [ativa]
          properties:
            ativa: { type: boolean }
    Obra:
      type: object
      required: [id, nome, cidade, uf, ativa, criadoEm]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        codigo: { type: string, nullable: true }
        cidade: { type: string }
        uf: { $ref: '#/components/schemas/Uf' }
        ativa: { type: boolean }
        criadoEm: { type: string, format: date-time }
    ObraResumo:
      allOf:
        - $ref: '#/components/schemas/Obra'
        - type: object
          required: [quantidadeEmpresas, quantidadeTiposExigidos]
          properties:
            quantidadeEmpresas: { type: integer, minimum: 0 }
            quantidadeTiposExigidos: { type: integer, minimum: 0, description: Tipos marcados como exigidos na obra. }
    ObraDetalhe:
      allOf:
        - $ref: '#/components/schemas/Obra'
        - type: object
          required: [empresas, vinculosEncerrados, quantidadeTiposExigidos]
          properties:
            empresas:
              type: array
              description: Empresas com vínculo ativo, ordenadas por razão social.
              items: { $ref: '#/components/schemas/EmpresaNaObra' }
            vinculosEncerrados:
              type: array
              description: Vínculos encerrados (histórico).
              items: { $ref: '#/components/schemas/VinculoEncerrado' }
            quantidadeTiposExigidos: { type: integer, minimum: 0, description: Tipos marcados como exigidos na obra. }
    VinculoEncerrado:
      type: object
      required: [empresaId, razaoSocial, cnpj, encerradoEm, quantidadeEnvios]
      properties:
        empresaId: { type: string, format: uuid }
        razaoSocial: { type: string }
        cnpj: { type: string }
        encerradoEm: { type: string, format: date-time }
        encerradoPorLogin: { type: string, nullable: true }
        quantidadeEnvios: { type: integer, minimum: 0, description: Envios da empresa nesta obra. }
    TipoExigidoObra:
      type: object
      required: [tipoDocumento, exigido]
      properties:
        tipoDocumento:
          allOf: [{ $ref: '#/components/schemas/TipoDocumento' }]
          description: Só tipos POR_OBRA (ativos, e inativos marcados).
        exigido: { type: boolean }
        marcadoEm: { type: string, format: date-time, nullable: true }
    ObraRef:
      type: object
      required: [id, nome, cidade, uf]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        cidade: { type: string }
        uf: { $ref: '#/components/schemas/Uf' }
    ObraNaEmpresa:
      allOf:
        - $ref: '#/components/schemas/ObraRef'
        - type: object
          required: [vinculoAtivo, obraAtiva, documentos]
          properties:
            vinculoAtivo: { type: boolean }
            obraAtiva: { type: boolean }
            documentos:
              allOf: [{ $ref: '#/components/schemas/ContagemDocumentos' }]
              description: Contagem dos documentos da obra para esta empresa.
    ObraPortal:
      allOf:
        - $ref: '#/components/schemas/ObraRef'
        - type: object
          required: [documentos]
          properties:
            documentos:
              allOf: [{ $ref: '#/components/schemas/ContagemDocumentos' }]
              description: Contagem dos documentos da obra para a empresa autenticada.
    PaginaObras:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/ObraResumo' }

    # ── Empresas ──
    EmpresaInput:
      type: object
      required: [razaoSocial, cnpj, emailContato]
      properties:
        razaoSocial: { type: string, minLength: 2, maxLength: 200 }
        nomeFantasia: { type: string, maxLength: 200, nullable: true }
        cnpj:
          type: string
          description: Com ou sem máscara; numérico ou alfanumérico; DV validado.
          example: 12.345.678/0001-95
          minLength: 14
          maxLength: 18
        emailContato: { type: string, format: email, maxLength: 254 }
        nomeContato: { type: string, maxLength: 150, nullable: true }
        telefone:
          type: string
          nullable: true
          description: Com ou sem máscara; 10 ou 11 dígitos.
          maxLength: 20
    EmpresaAtualizacao:
      allOf:
        - $ref: '#/components/schemas/EmpresaInput'
        - type: object
          required: [ativa]
          properties:
            ativa: { type: boolean }
    ContagemDocumentos:
      type: object
      required: [total, pendentes, emAnalise, aprovados, rejeitados, periodosAtrasados]
      properties:
        total: { type: integer, minimum: 0, description: Documentos exigidos no contexto (tipos GERAL ativos na empresa; tipos marcados e ativos na obra). }
        pendentes: { type: integer, minimum: 0 }
        emAnalise: { type: integer, minimum: 0 }
        aprovados: { type: integer, minimum: 0 }
        rejeitados: { type: integer, minimum: 0 }
        periodosAtrasados:
          type: integer
          minimum: 0
          description: Soma dos períodos atrasados dos documentos periódicos (cada documento conta uma vez nas demais contagens, pela situação resumida).
    EmpresaResumo:
      type: object
      required: [id, razaoSocial, cnpj, emailContato, ativa, situacaoAcesso, documentos]
      properties:
        id: { type: string, format: uuid }
        razaoSocial: { type: string }
        nomeFantasia: { type: string, nullable: true }
        cnpj: { type: string, pattern: '^[0-9A-Z]{12}[0-9]{2}$', example: '12345678000195' }
        emailContato: { type: string }
        ativa: { type: boolean }
        situacaoAcesso: { $ref: '#/components/schemas/SituacaoAcesso' }
        documentos:
          allOf: [{ $ref: '#/components/schemas/ContagemDocumentos' }]
          description: Só documentos gerais.
        documentosObra:
          type: object
          allOf: [{ $ref: '#/components/schemas/ContagemDocumentos' }]
          nullable: true
          description: Documentos da obra; preenchido só quando a lista foi filtrada por `obraId`.
    Empresa:
      allOf:
        - $ref: '#/components/schemas/EmpresaResumo'
        - type: object
          required: [obras, cnpjEditavel, criadoEm]
          properties:
            nomeContato: { type: string, nullable: true }
            telefone: { type: string, nullable: true, description: Só dígitos. }
            obras:
              type: array
              description: Obras vinculadas, inclusive vínculos encerrados (`vinculoAtivo=false`).
              items: { $ref: '#/components/schemas/ObraNaEmpresa' }
            cnpjEditavel:
              type: boolean
              description: false depois do primeiro convite.
            ultimoConvite:
              type: object
              allOf: [{ $ref: '#/components/schemas/Convite' }]
              nullable: true
            ultimoAcessoEm: { type: string, format: date-time, nullable: true }
            criadoEm: { type: string, format: date-time }
    EmpresaNaObra:
      type: object
      required: [empresaId, razaoSocial, cnpj, situacaoAcesso, vinculadoEm, documentosObra, documentosGerais, quantidadeEnviosNaObra]
      properties:
        empresaId: { type: string, format: uuid }
        razaoSocial: { type: string }
        cnpj: { type: string }
        situacaoAcesso: { $ref: '#/components/schemas/SituacaoAcesso' }
        vinculadoEm: { type: string, format: date-time }
        documentosObra:
          allOf: [{ $ref: '#/components/schemas/ContagemDocumentos' }]
          description: Contagem dos documentos desta obra para a empresa.
        documentosGerais:
          allOf: [{ $ref: '#/components/schemas/ContagemDocumentos' }]
          description: Contagem dos documentos gerais da empresa.
        quantidadeEnviosNaObra:
          type: integer
          minimum: 0
          description: Envios da empresa nesta obra (para a confirmação de desvincular).
    EmpresaRef:
      type: object
      required: [id, razaoSocial, cnpj]
      properties:
        id: { type: string, format: uuid }
        razaoSocial: { type: string }
        cnpj: { type: string }
    PaginaEmpresas:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/EmpresaResumo' }

    # ── Convites ──
    Convite:
      type: object
      description: Nunca contém o token nem a senha temporária.
      required: [id, emailDestino, enviadoEm, expiraEm, enviadoPor, situacao]
      properties:
        id: { type: string, format: uuid }
        emailDestino: { type: string }
        enviadoEm: { type: string, format: date-time }
        expiraEm: { type: string, format: date-time }
        usadoEm: { type: string, format: date-time, nullable: true }
        enviadoPor: { $ref: '#/components/schemas/AutorFluig' }
        situacao: { $ref: '#/components/schemas/SituacaoConvite' }
    ConviteValidacaoInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Token do link do convite (base64url, 43 caracteres), lido de `?convite=` no portal.
    ConviteValidacao:
      type: object
      required: [cnpj, razaoSocial, expiraEm]
      properties:
        cnpj: { type: string }
        razaoSocial: { type: string }
        expiraEm: { type: string, format: date-time }

    # ── Tipos de documento ──
    TipoDocumentoInput:
      type: object
      required: [nome, abrangencia]
      properties:
        nome: { type: string, minLength: 3, maxLength: 120 }
        instrucoes: { type: string, maxLength: 1000, nullable: true }
        abrangencia: { $ref: '#/components/schemas/Abrangencia' }
        periodicidade:
          allOf: [{ $ref: '#/components/schemas/Periodicidade' }]
          description: Omitido no cadastro = UNICA. Omitido (ou null) na atualização = mantém a periodicidade atual.
    TipoDocumentoAtualizacao:
      allOf:
        - $ref: '#/components/schemas/TipoDocumentoInput'
        - type: object
          required: [ativo]
          properties:
            ativo: { type: boolean }
    TipoDocumento:
      type: object
      required: [id, nome, abrangencia, periodicidade, ativo, criadoEm]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        instrucoes: { type: string, nullable: true }
        abrangencia: { $ref: '#/components/schemas/Abrangencia' }
        periodicidade: { $ref: '#/components/schemas/Periodicidade' }
        ativo: { type: boolean }
        criadoEm: { type: string, format: date-time }
    TipoDocumentoRef:
      type: object
      required: [id, nome, abrangencia, periodicidade]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        instrucoes: { type: string, nullable: true }
        abrangencia: { $ref: '#/components/schemas/Abrangencia' }
        periodicidade: { $ref: '#/components/schemas/Periodicidade' }
    Periodicidade:
      type: object
      required: [unidade]
      properties:
        unidade: { $ref: '#/components/schemas/UnidadePeriodicidade' }
        intervalo:
          type: integer
          nullable: true
          minimum: 1
          maximum: 365
          description: Null se UNICA; MESES 1–24; DIAS 1–365.
        prazoDias:
          type: integer
          nullable: true
          minimum: 0
          maximum: 90
          description: Dias depois do fim do período para enviar sem atraso. Null se UNICA; 0–90.
        descricao:
          type: string
          readOnly: true
          description: Texto pronto para exibir (só em respostas).
          example: Mensal · até o dia 15 do mês seguinte

    # ── Períodos (documentos periódicos) ──
    PeriodoRef:
      type: object
      description: Período a que um envio se refere.
      required: [inicio, fim, rotulo]
      properties:
        inicio: { type: string, format: date }
        fim: { type: string, format: date }
        rotulo: { type: string, example: Março/2026 }
    PeriodoComPrazo:
      allOf:
        - $ref: '#/components/schemas/PeriodoRef'
        - type: object
          required: [prazo]
          properties:
            prazo: { type: string, format: date, description: Último dia para enviar sem atraso (fim + prazoDias). }
    ResumoPeriodos:
      type: object
      description: Contagem dos períodos exigidos de um documento periódico. Cada período entra uma vez em pendentes, rejeitados, emAnalise ou aprovados; atrasados conta, à parte, quantos dos pendentes e rejeitados já passaram do prazo (se sobrepõe a eles).
      required: [atrasados, pendentes, rejeitados, emAnalise, aprovados]
      properties:
        atrasados: { type: integer, minimum: 0, description: 'Subconjunto de pendentes + rejeitados com o prazo vencido.' }
        pendentes: { type: integer, minimum: 0 }
        rejeitados: { type: integer, minimum: 0 }
        emAnalise: { type: integer, minimum: 0 }
        aprovados: { type: integer, minimum: 0 }
        proximo:
          type: object
          allOf: [{ $ref: '#/components/schemas/PeriodoComPrazo' }]
          nullable: true
          description: Primeiro período (o mais antigo) que pede ação; null se nenhum.
    Periodo:
      description: Visão da Jotanunes de um período exigido.
      allOf:
        - $ref: '#/components/schemas/PeriodoComPrazo'
        - type: object
          required: [situacao, atrasado, quantidadeEnvios]
          properties:
            situacao: { $ref: '#/components/schemas/SituacaoDocumento' }
            atrasado: { type: boolean, description: Prazo vencido com situação PENDENTE_ENVIO ou REJEITADO. }
            envioAtual:
              type: object
              allOf: [{ $ref: '#/components/schemas/Envio' }]
              nullable: true
              description: Envio que define a situação do período (null se PENDENTE_ENVIO).
            quantidadeEnvios: { type: integer, minimum: 0 }
    PeriodoPortal:
      description: Visão da empresa de um período exigido.
      allOf:
        - $ref: '#/components/schemas/PeriodoComPrazo'
        - type: object
          required: [situacao, atrasado, podeEnviar]
          properties:
            situacao: { $ref: '#/components/schemas/SituacaoDocumento' }
            atrasado: { type: boolean, description: Prazo vencido com situação PENDENTE_ENVIO ou REJEITADO. }
            envioAtual:
              type: object
              allOf: [{ $ref: '#/components/schemas/EnvioPortal' }]
              nullable: true
            podeEnviar:
              type: boolean
              description: true quando a situação do período é PENDENTE_ENVIO ou REJEITADO e o documento é exigido.

    # ── Envios ──
    Envio:
      type: object
      description: Visão da Jotanunes (inclui quem analisou).
      required: [id, empresaId, tipoDocumentoId, nomeArquivo, formato, tamanhoBytes, enviadoEm, status, enviadoComAtraso]
      properties:
        id: { type: string, format: uuid }
        empresaId: { type: string, format: uuid }
        tipoDocumentoId: { type: string, format: uuid }
        obraId: { type: string, format: uuid, nullable: true, description: Obra do envio (null = documento geral). }
        nomeArquivo: { type: string }
        formato: { $ref: '#/components/schemas/FormatoArquivo' }
        tamanhoBytes: { type: integer, minimum: 1, maximum: 10485760 }
        enviadoEm: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/StatusEnvio' }
        periodo:
          type: object
          allOf: [{ $ref: '#/components/schemas/PeriodoRef' }]
          nullable: true
          description: Período do envio (null = tipo de periodicidade UNICA).
        enviadoComAtraso: { type: boolean, description: Enviado depois do prazo do período (sempre false para UNICA). }
        analisadoEm: { type: string, format: date-time, nullable: true }
        analisadoPor:
          type: object
          allOf: [{ $ref: '#/components/schemas/AutorFluig' }]
          nullable: true
        motivoRejeicao: { type: string, nullable: true }
    EnvioFila:
      allOf:
        - $ref: '#/components/schemas/Envio'
        - type: object
          required: [empresa, tipoDocumento]
          properties:
            empresa: { $ref: '#/components/schemas/EmpresaRef' }
            tipoDocumento: { $ref: '#/components/schemas/TipoDocumentoRef' }
            obra:
              type: object
              allOf: [{ $ref: '#/components/schemas/ObraRef' }]
              nullable: true
              description: Obra do envio (null = documento geral).
    PaginaEnvios:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/EnvioFila' }
    Rejeicao:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 5, maxLength: 500, description: Espaços nas pontas são removidos antes de validar. }
    DocumentoSituacao:
      type: object
      description: |
        Para tipo periódico, `situacao` e `envioAtual` são os do período resumido: algum atrasado
        primeiro; senão REJEITADO > PENDENTE_ENVIO > EM_ANALISE > APROVADO.
      required: [tipoDocumento, situacao, atrasado]
      properties:
        tipoDocumento: { $ref: '#/components/schemas/TipoDocumentoRef' }
        situacao: { $ref: '#/components/schemas/SituacaoDocumento' }
        envioAtual:
          type: object
          allOf: [{ $ref: '#/components/schemas/Envio' }]
          nullable: true
          description: Envio que define a situação (null se PENDENTE_ENVIO).
        quantidadeEnvios: { type: integer, minimum: 0 }
        atrasado: { type: boolean, description: Algum período atrasado (sempre false para UNICA). }
        periodos:
          type: object
          allOf: [{ $ref: '#/components/schemas/ResumoPeriodos' }]
          nullable: true
          description: Resumo dos períodos (null para tipo de periodicidade UNICA).

    # ── Portal ──
    LoginInput:
      type: object
      required: [cnpj, senha]
      properties:
        cnpj: { type: string, minLength: 14, maxLength: 18 }
        senha: { type: string, minLength: 1, maxLength: 128 }
    TrocaSenhaInput:
      type: object
      required: [senhaAtual, novaSenha]
      properties:
        senhaAtual: { type: string, minLength: 1, maxLength: 128 }
        novaSenha:
          type: string
          minLength: 8
          maxLength: 128
          description: Ao menos 1 letra e 1 número; diferente da atual.
    EmpresaPortal:
      type: object
      required: [id, razaoSocial, cnpj, trocaSenhaObrigatoria]
      properties:
        id: { type: string, format: uuid }
        razaoSocial: { type: string }
        nomeFantasia: { type: string, nullable: true }
        cnpj: { type: string }
        trocaSenhaObrigatoria: { type: boolean }
    SessaoPortal:
      type: object
      required: [accessToken, expiraEm, empresa]
      properties:
        accessToken: { type: string, description: JWT portalAuth. }
        expiraEm: { type: string, format: date-time }
        empresa: { $ref: '#/components/schemas/EmpresaPortal' }
    EnvioPortal:
      type: object
      description: Visão da empresa (NÃO inclui quem analisou).
      required: [id, tipoDocumentoId, nomeArquivo, formato, tamanhoBytes, enviadoEm, status, enviadoComAtraso]
      properties:
        id: { type: string, format: uuid }
        tipoDocumentoId: { type: string, format: uuid }
        obraId: { type: string, format: uuid, nullable: true, description: Obra do envio (null = documento geral). }
        nomeArquivo: { type: string }
        formato: { $ref: '#/components/schemas/FormatoArquivo' }
        tamanhoBytes: { type: integer, minimum: 1, maximum: 10485760 }
        enviadoEm: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/StatusEnvio' }
        periodo:
          type: object
          allOf: [{ $ref: '#/components/schemas/PeriodoRef' }]
          nullable: true
          description: Período do envio (null = tipo de periodicidade UNICA).
        enviadoComAtraso: { type: boolean, description: Enviado depois do prazo do período (sempre false para UNICA). }
        analisadoEm: { type: string, format: date-time, nullable: true }
        motivoRejeicao: { type: string, nullable: true }
    DocumentoSituacaoPortal:
      type: object
      description: |
        Para tipo periódico, `situacao` e `envioAtual` são os do período resumido (ver `DocumentoSituacao`).
      required: [tipoDocumento, situacao, podeEnviar, atrasado]
      properties:
        tipoDocumento: { $ref: '#/components/schemas/TipoDocumentoRef' }
        situacao: { $ref: '#/components/schemas/SituacaoDocumento' }
        envioAtual:
          type: object
          allOf: [{ $ref: '#/components/schemas/EnvioPortal' }]
          nullable: true
        podeEnviar:
          type: boolean
          description: true quando situação é PENDENTE_ENVIO ou REJEITADO.
        atrasado: { type: boolean, description: Algum período atrasado (sempre false para UNICA). }
        periodos:
          type: object
          allOf: [{ $ref: '#/components/schemas/ResumoPeriodos' }]
          nullable: true
          description: Resumo dos períodos (null para tipo de periodicidade UNICA).
