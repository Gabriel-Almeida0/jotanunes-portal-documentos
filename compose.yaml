name: jotanunes-docs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jotanunes_docs
      POSTGRES_USER: ${POSTGRES_USER:-jotanunes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jotanunes}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
